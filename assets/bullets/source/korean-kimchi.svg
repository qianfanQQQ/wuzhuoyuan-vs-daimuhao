  <g>
    <path d="M 330 512 C 300 484 280 456 280 424 C 312 444 338 470 356 496 C 346 502 336 508 330 512 Z" fill="url(#kimchi-rib)" stroke="#5b7f3f" stroke-width="4"/>
    <path d="M 326 520 C 290 508 260 490 238 466 C 274 466 306 480 334 500 Z" fill="url(#kimchi-underleaf)" opacity="0.9"/>
    <path d="M 320 500 C 294 478 278 456 272 434" stroke="#fffbe0" stroke-width="6" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M 320 516 C 294 508 270 496 252 480" stroke="#e2f0a7" stroke-width="5" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M 338 478 C 316 452 304 424 306 396 C 330 420 348 446 356 472 Z" fill="url(#kimchi-green)" stroke="#315f2e" stroke-width="3"/>
    <path d="M 334 482 C 320 456 312 434 312 414" stroke="#e8ffb0" stroke-width="3" fill="none" opacity="0.6"/>
  </g>

  <!-- green onion garnish -->
  <g fill="none" stroke-linecap="round">
    <path d="M 430 402 C 454 374 480 356 512 348" stroke="#5f9a4b" stroke-width="9" opacity="0.9"/>
    <path d="M 460 404 C 486 382 512 370 540 366" stroke="#8bc66a" stroke-width="6" opacity="0.8"/>
    <path d="M 448 390 C 462 374 476 364 492 358" stroke="#d7f2a1" stroke-width="3" opacity="0.6"/>
    <path d="M 512 348 C 526 336 540 330 554 330" stroke="#4e853e" stroke-width="7"/>
  </g>

