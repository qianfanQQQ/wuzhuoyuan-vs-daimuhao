    <path d="M 342 500 C 386 448 450 426 522 430 C 596 434 662 458 722 494 C 752 512 770 528 760 540 C 738 558 702 568 668 578 C 634 588 608 582 580 592 C 534 608 486 608 442 592 C 400 578 368 556 346 532 C 332 518 330 510 342 500 Z"
