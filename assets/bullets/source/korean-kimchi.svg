  </g>

  <!-- sesame seeds and chili flakes -->
  <g fill="#fff4d1" stroke="#c69a50" stroke-width="1.2">
    <ellipse cx="430" cy="480" rx="8" ry="4" transform="rotate(-24 430 480)"/>
    <ellipse cx="484" cy="522" rx="7" ry="3.5" transform="rotate(14 484 522)"/>
    <ellipse cx="586" cy="474" rx="8" ry="4" transform="rotate(-34 586 474)"/>
    <ellipse cx="636" cy="528" rx="7" ry="3.5" transform="rotate(22 636 528)"/>
    <ellipse cx="694" cy="500" rx="6" ry="3" transform="rotate(-16 694 500)"/>
    <ellipse cx="378" cy="522" rx="6" ry="3" transform="rotate(28 378 522)"/>
    <ellipse cx="542" cy="448" rx="6" ry="3" transform="rotate(-20 542 448)"/>
    <ellipse cx="456" cy="566" rx="6" ry="3" transform="rotate(12 456 566)"/>
  </g>
  <g fill="#ffb13e" opacity="0.7">
    <circle cx="560" cy="492" r="3"/>
    <circle cx="610" cy="514" r="2.5"/>
    <circle cx="674" cy="474" r="3"/>
    <circle cx="704" cy="548" r="2.5"/>
    <circle cx="402" cy="546" r="2.5"/>
  </g>

  <!-- leading edge / cool accent -->
  <g>
    <path d="M 756 496 C 776 504 792 512 806 520" fill="none" stroke="#7df2ff" stroke-width="5" opacity="0.4" stroke-linecap="round"/>
    <path d="M 780 512 L 814 512" stroke="#fff6df" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <circle cx="814" cy="512" r="7" fill="#fff6df"/>
    <circle cx="814" cy="512" r="24" fill="#ff9c3e" opacity="0.22" filter="url(#kimchi-glow)"/>
  </g>

  <!-- flying flakes -->
  <g>
    <path d="M 712 414 C 728 400 744 396 760 402 C 744 414 728 422 714 424 Z" fill="#ffb346" opacity="0.7"/>
    <path d="M 760 584 C 776 576 792 578 804 588 C 786 596 770 598 754 594 Z" fill="#ff7432" opacity="0.6"/>
    <circle cx="760" cy="444" r="4.5" fill="#5de1ff" opacity="0.6"/>
    <circle cx="790" cy="558" r="4" fill="#ffcf66" opacity="0.65"/>
    <path d="M 336 622 L 340 634 L 352 638 L 340 642 L 336 654 L 332 642 L 320 638 L 332 634 Z" fill="#ffe6aa" opacity="0.55"/>
  </g>
</svg>
