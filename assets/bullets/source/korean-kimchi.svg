    <path d="M 446 604 C 494 620 548 620 594 604 C 616 596 642 596 664 602 C 634 622 592 634 544 636 C 506 636 474 624 446 604 Z" fill="url(#kimchi-underleaf)" opacity="0.9"/>
    <path d="M 688 456 C 722 444 758 448 780 464 C 752 466 728 478 708 492 Z" fill="#79a854" opacity="0.9"/>
    <path d="M 688 588 C 722 600 758 594 778 578 C 750 578 726 570 706 556 Z" fill="#5f8e45" opacity="0.85"/>
