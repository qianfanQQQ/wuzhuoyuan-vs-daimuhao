          fill="url(#kimchi-rib)" stroke="#a9c26f" stroke-width="2" opacity="0.95"/>
    <path d="M 360 554 C 444 560 526 550 606 536 C 660 528 704 522 744 524" fill="none" stroke="#fffdf0" stroke-width="5" opacity="0.7" stroke-linecap="round"/>
    <!-- branching cabbage ribs -->
    <path d="M 402 456 C 458 480 520 490 584 480 C 634 472 676 460 712 448" fill="none" stroke="#fff4c9" stroke-width="11" opacity="0.35" stroke-linecap="round"/>
    <path d="M 408 456 C 462 478 520 486 580 478" fill="none" stroke="#fffdf0" stroke-width="4" opacity="0.45" stroke-linecap="round"/>
    <path d="M 500 440 C 514 472 518 502 512 532" fill="none" stroke="#ffefb9" stroke-width="7" opacity="0.3" stroke-linecap="round"/>
    <!-- folds and gloss -->
    <path d="M 420 570 C 478 550 542 538 610 536" fill="none" stroke="#75151a" stroke-width="10" opacity="0.22" stroke-linecap="round"/>
    <ellipse cx="470" cy="486" rx="46" ry="15" fill="#ffb14b" opacity="0.28" transform="rotate(-14 470 486)"/>
    <ellipse cx="644" cy="540" rx="34" ry="11" fill="#ff7f35" opacity="0.22" transform="rotate(10 644 540)"/>
    <path d="M 384 520 C 424 504 464 496 504 496" fill="none" stroke="#fff3c8" stroke-width="4" opacity="0.25" stroke-linecap="round"/>
  </g>

