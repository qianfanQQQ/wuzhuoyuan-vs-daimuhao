<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="kimchi-aura" cx="0.53" cy="0.5" r="0.56">
      <stop offset="0" stop-color="#ff6a2e" stop-opacity="0.52"/>
      <stop offset="0.4" stop-color="#ffb13e" stop-opacity="0.2"/>
      <stop offset="0.7" stop-color="#5de1ff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ff5b2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kimchi-paste" x1="330" y1="420" x2="776" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc553"/>
      <stop offset="0.18" stop-color="#ff7e2b"/>
      <stop offset="0.48" stop-color="#e44427"/>
      <stop offset="0.78" stop-color="#b32520"/>
      <stop offset="1" stop-color="#741218"/>
    </linearGradient>
    <linearGradient id="kimchi-rib" x1="300" y1="550" x2="772" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf0"/>
      <stop offset="0.38" stop-color="#f1f3c8"/>
      <stop offset="0.72" stop-color="#c9de91"/>
      <stop offset="1" stop-color="#eef3b7"/>
    </linearGradient>
    <linearGradient id="kimchi-underleaf" x1="340" y1="530" x2="700" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.42" stop-color="#d9e89b"/>
      <stop offset="0.78" stop-color="#8fb961"/>
      <stop offset="1" stop-color="#4c7d3d"/>
    </linearGradient>
    <linearGradient id="kimchi-green" x1="238" y1="390" x2="420" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e2f79c"/>
      <stop offset="0.45" stop-color="#82c05d"/>
      <stop offset="1" stop-color="#356d3b"/>
    </linearGradient>
    <linearGradient id="kimchi-chili" x1="500" y1="380" x2="680" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd05a"/>
      <stop offset="0.25" stop-color="#ff6a2d"/>
      <stop offset="0.7" stop-color="#ce241e"/>
      <stop offset="1" stop-color="#7e1015"/>
    </linearGradient>
    <filter id="kimchi-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="kimchi-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <ellipse cx="520" cy="512" rx="342" ry="202" fill="url(#kimchi-aura)"/>

  <!-- motion streaks -->
  <g fill="none" stroke-linecap="round">
    <path d="M 120 516 C 230 480 312 458 400 466" stroke="#ff7c2e" stroke-width="7" opacity="0.2"/>
    <path d="M 164 572 C 260 554 342 540 424 548" stroke="#ffb35a" stroke-width="4" opacity="0.26"/>
    <path d="M 174 442 C 262 414 332 408 408 426" stroke="#5de1ff" stroke-width="2.5" opacity="0.24"/>
    <path d="M 126 486 C 214 454 276 440 344 444" stroke="#ff4c2c" stroke-width="2.5" opacity="0.15"/>
  </g>

  <!-- loose chili oil and sesame -->
  <g>
    <circle cx="252" cy="470" r="8" fill="#ff8b36" opacity="0.75"/>
    <circle cx="252" cy="470" r="22" fill="#ff5d26" opacity="0.25" filter="url(#kimchi-glow)"/>
    <circle cx="214" cy="552" r="5" fill="#ffcf66" opacity="0.7"/>
    <circle cx="314" cy="608" r="6" fill="#ff7931" opacity="0.6"/>
    <ellipse cx="286" cy="510" rx="7" ry="3.5" fill="#fff2c8" opacity="0.75" transform="rotate(-26 286 510)"/>
    <ellipse cx="230" cy="518" rx="5" ry="2.5" fill="#fff2c8" opacity="0.55" transform="rotate(18 230 518)"/>
