  <g>
    <path d="M 302 514 C 318 464 356 428 408 408 C 462 388 522 390 578 404 C 640 420 700 450 750 486 C 776 502 796 516 790 534 C 782 554 758 566 732 576 C 704 586 674 594 644 590 C 616 586 592 604 564 610 C 518 620 478 612 440 600 C 390 586 352 562 322 538 C 306 526 296 520 302 514 Z"
